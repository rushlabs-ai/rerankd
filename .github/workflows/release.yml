name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload release assets
      id-token: write      # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: Test
        run: go vet ./... && go test -count=1 ./...
      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="rerankd_${TAG#v}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG#v}" -o "build/$name/rerankd$ext" .
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
